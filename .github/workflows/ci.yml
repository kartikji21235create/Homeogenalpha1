name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan (Problem 27)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-eval:
    name: Tests & Retrieval Eval Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Unit & Contract Tests
        run: npx tsx --test tests/*.test.ts

      - name: Run Gated Loader Verification
        run: npx tsx seed/loader.ts

      - name: Run Retrieval Eval Regression Check (Gate: Recall@20 >= 90%)
        run: |
          npx tsx -e '
            import { runEvalHarness } from "./evals/eval_harness";
            const report = runEvalHarness();
            if (report.recallAt20 < 0.90) {
              console.error(`EVAL REGRESSION: Recall@20 is ${(report.recallAt20 * 100).toFixed(1)}%, below 90% threshold!`);
              process.exit(1);
            }
            console.log(`Eval Gate Passed: Recall@20 is ${(report.recallAt20 * 100).toFixed(1)}%`);
          '

      - name: Build Next.js Production Bundle
        run: npm run build
